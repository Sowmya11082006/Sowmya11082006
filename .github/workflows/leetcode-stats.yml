name: Update LeetCode Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate LeetCode Stats
        run: |
          python - <<'PY'
          import requests
          import html

          username = "SowmyaNKumar"

          query = """
          query userProfileUserQuestionProgressV2($userSlug: String!) {
            userProfileUserQuestionProgressV2(userSlug: $userSlug) {
              numAcceptedQuestions {
                difficulty
                count
              }
              numFailedQuestions {
                difficulty
                count
              }
              numUntouchedQuestions {
                difficulty
                count
              }
            }
          }
          """

          response = requests.post(
              "https://leetcode.com/graphql",
              json={
                  "query": query,
                  "variables": {"userSlug": username}
              },
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0"
              }
          )

          data = response.json()["data"]["userProfileUserQuestionProgressV2"]

          accepted = {
              item["difficulty"]: item["count"]
              for item in data["numAcceptedQuestions"]
          }

          easy = accepted.get("EASY", 0)
          medium = accepted.get("MEDIUM", 0)
          hard = accepted.get("HARD", 0)
          total = easy + medium + hard

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220">
            <rect width="100%" height="100%" rx="15" fill="#0d1117"/>
            <text x="35" y="45" font-family="Arial" font-size="24" fill="#ffffff">
              LeetCode Stats
            </text>

            <text x="35" y="90" font-family="Arial" font-size="20" fill="#ffffff">
              Problems Solved: {total}
            </text>

            <text x="35" y="130" font-family="Arial" font-size="17" fill="#00b8a9">
              Easy: {easy}
            </text>

            <text x="220" y="130" font-family="Arial" font-size="17" fill="#ffc01e">
              Medium: {medium}
            </text>

            <text x="430" y="130" font-family="Arial" font-size="17" fill="#ef4743">
              Hard: {hard}
            </text>

            <text x="35" y="180" font-family="Arial" font-size="14" fill="#8b949e">
              Updated automatically from LeetCode
            </text>
          </svg>'''

          with open("leetcode-stats.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leetcode-stats.svg
          git commit -m "Update LeetCode stats" || exit 0
          git push
